<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dreamy Lovers</title>
<style>
html,body{margin:0;padding:0;background:#08060f;overscroll-behavior:none;-webkit-text-size-adjust:100%}
@media(max-width:700px){.app{height:100dvh!important;border-radius:0!important}.wrap{max-width:none!important}}
</style>
</head>
<body>
<div class="wrap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff3d8b;--violet:#a855f7;--cyan:#22d3ee;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#f6f1ff;--mut:#a094bd;--dim:#6f6689}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:700px;margin:0 auto;font-family:'Outfit',Inter,system-ui,sans-serif}
.app{position:relative;width:100%;height:900px;border-radius:26px;overflow:hidden;display:flex;color:var(--txt);
 background:radial-gradient(900px 500px at 100% -10%,rgba(168,85,247,.28),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(255,61,139,.22),transparent 60%),linear-gradient(160deg,#0c0817,#07050d 60%);
 border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.app *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.app ::-webkit-scrollbar{width:6px;height:6px}
.app ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit}
.rail{width:74px;flex:0 0 74px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;background:rgba(255,255,255,.02)}
.brand-dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:-.5px;background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 24px rgba(255,61,139,.35)}
.rail-avatars{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.rav{width:48px;height:48px;border-radius:16px;overflow:hidden;border:1.5px solid transparent;position:relative;flex:0 0 auto;background:#1a1330}
.rav img{width:100%;height:100%;object-fit:cover;display:block}
.rav .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:600}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);flex:0 0 auto}
.icon-btn svg{width:19px;height:19px;stroke:var(--txt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.disc{overflow-y:auto;padding:20px 18px 80px}
.hero h1{font-size:31px;line-height:1.05;margin:0 0 8px;font-weight:600;letter-spacing:-1.1px}
.hero h1 span{background:linear-gradient(100deg,var(--pink),var(--violet) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 13px;color:var(--mut);font-size:14px;max-width:450px;line-height:1.5}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.badge{font-size:11px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.badge.hot{border-color:rgba(255,61,139,.4);background:rgba(255,61,139,.12);color:#ffc0da}
.install{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.install button{font-size:12.5px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt)}
.install button.pri{background:linear-gradient(140deg,var(--pink),var(--violet));border-color:transparent;color:#fff;font-weight:500}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin:0 0 7px;font-weight:500}
.langrow{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;margin-bottom:13px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.lang.on{background:linear-gradient(140deg,var(--pink),var(--violet));border-color:transparent;color:#fff;font-weight:500}
.seg{display:flex;gap:4px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:99px;padding:4px;width:fit-content;margin-bottom:13px;flex-wrap:wrap}
.seg button{font-size:12px;padding:6px 13px;border-radius:99px;color:var(--mut)}
.seg button.on{background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff;font-weight:500}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 10px}
.sec-title h2{font-size:12.5px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);margin:0;font-weight:500}
.sec-title em{font-size:11.5px;color:var(--dim);font-style:normal}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.ccard{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);position:relative;text-align:left}
.ccard.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,61,139,.2)}
.ccard .shot{aspect-ratio:3/4;position:relative;overflow:hidden;background:#170f28}
.ccard .shot img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .shot .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:600;color:rgba(255,255,255,.85)}
.ccard .shot .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,6,15,.94) 6%,rgba(8,6,15,.15) 55%,transparent)}
.ccard .meta{position:absolute;left:0;right:0;bottom:0;padding:10px 11px}
.ccard .meta h3{margin:0;font-size:14px;font-weight:600;display:flex;gap:6px}
.ccard .meta h3 i{font-style:normal;font-size:11px;font-weight:400;color:var(--mut)}
.ccard .meta p{margin:2px 0 0;font-size:11.5px;color:var(--mut);line-height:1.35}
.ccard .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:99px;border:1.5px solid rgba(255,255,255,.5);background:rgba(8,6,15,.6);display:grid;place-items:center;font-size:12px;opacity:0}
.ccard.sel .tick{opacity:1;background:var(--pink);border-color:var(--pink)}
.strip{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px}
.scene{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;white-space:nowrap;font-size:12.5px;color:var(--mut)}
.scene b{font-weight:500;color:var(--txt)}
.note{font-size:11.5px;color:var(--dim);line-height:1.6;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
.note code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:11px;color:#dcc8ff}
.pairbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:linear-gradient(to top,rgba(8,6,15,.97),rgba(8,6,15,.7));border-top:1px solid var(--line);display:none;gap:10px;align-items:center}
.pairbar.on{display:flex}
.pairbar .txt{flex:1;font-size:12.5px;color:var(--mut)}.pairbar .txt b{color:#fff;font-weight:500}
.pairbar button{background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:12px}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);background:rgba(10,7,18,.6);backdrop-filter:blur(14px);z-index:5}
.chead .avs{display:flex;flex:0 0 auto}
.chead .av{width:38px;height:38px;border-radius:13px;overflow:hidden;position:relative;background:#1a1330;border:1px solid var(--line)}
.chead .av+.av{margin-left:-12px;box-shadow:-4px 0 10px rgba(0,0,0,.5)}
.chead .av img{width:100%;height:100%;object-fit:cover}
.chead .av .ph{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:14px}
.chead h3{margin:0;font-size:14.5px;font-weight:600;display:flex;gap:6px}
.chead h3 i{font-style:normal;font-size:11px;color:var(--mut);font-weight:400}
.chead .st{font-size:11px;color:var(--mut);display:flex;gap:5px;align-items:center;margin-top:1px}
.chead .st i{width:6px;height:6px;border-radius:99px;background:#3ddc7f;box-shadow:0 0 7px #3ddc7f}
.chead .st.typing{color:#ffb8d6}.chead .st.typing i{background:var(--pink);box-shadow:0 0 7px var(--pink);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.35}}
.grow{flex:1}.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.row{display:flex;gap:8px;max-width:90%}
.row.u{align-self:flex-end;flex-direction:row-reverse}
.row .pav{width:28px;height:28px;border-radius:10px;overflow:hidden;flex:0 0 auto;align-self:flex-end;background:#1a1330}
.row .pav img{width:100%;height:100%;object-fit:cover}
.bub{border-radius:17px;padding:10px 13px;font-size:14.2px;line-height:1.58}
.row.a .bub{background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.04));border:1px solid var(--line);border-bottom-left-radius:6px}
.row.u .bub{background:linear-gradient(140deg,var(--pink),#c1359f 90%);color:#fff;border-bottom-right-radius:6px}
.spk{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:3px;font-weight:500}
.bub em{color:#ffc9e2;font-style:italic}.row.u .bub em{color:#ffe3f0}
.caret{display:inline-block;width:6px;height:14px;background:var(--pink);border-radius:2px;margin-left:2px;vertical-align:-2px;animation:bl .9s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.tools{display:flex;gap:6px;margin-top:6px;opacity:.5}
.tools button{font-size:10.5px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.03)}
.dots{display:flex;gap:4px;padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--mut);animation:bo 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.notice{align-self:center;font-size:11px;color:#c9b6ff;border:1px solid rgba(168,85,247,.3);background:rgba(168,85,247,.1);padding:5px 12px;border-radius:99px;max-width:90%;text-align:center}
.gen{margin-top:8px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#100b1d;width:250px;max-width:100%}
.gen .cap{font-size:10.5px;color:var(--mut);padding:7px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;line-height:1.3}
.gen .cap svg{width:12px;height:12px;stroke:var(--pink);fill:none;stroke-width:1.7;flex:0 0 auto}
.gen .frame{position:relative;aspect-ratio:2/3;background:linear-gradient(140deg,#1a1230,#0e0a1a)}
.gen .frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.gen .frame img.in{opacity:1}
.shim{position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.09) 50%,transparent 80%);background-size:220% 100%;animation:sw 1.4s infinite}
@keyframes sw{to{background-position:-220% 0}}
.gen .frame .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;font-size:11px;color:rgba(255,255,255,.75);line-height:1.4}
.gen .acts{display:flex;border-top:1px solid var(--line)}
.gen .acts button{flex:1;font-size:11px;color:var(--mut);padding:8px 4px}
.gen .acts button+button{border-left:1px solid var(--line)}
.comp{border-top:1px solid var(--line);padding:9px 12px 12px;background:rgba(10,7,18,.6);backdrop-filter:blur(14px)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 8px}
.chip{white-space:nowrap;font-size:11.5px;color:var(--mut);border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:99px}
.inbar{display:flex;gap:8px;align-items:flex-end}
.inbar textarea{flex:1;resize:none;max-height:104px;min-height:44px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);padding:12px 14px;font-size:14.2px;line-height:1.4;outline:none}
.inbar textarea:focus{border-color:rgba(255,61,139,.55)}
.send{width:44px;height:44px;border-radius:15px;background:linear-gradient(140deg,var(--pink),var(--violet));display:grid;place-items:center;flex:0 0 auto}
.send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fine{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:7px;padding:0 3px}
.heat{display:flex;gap:3px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:99px;padding:3px}
.heat button{font-size:10.5px;padding:4px 8px;border-radius:99px;color:var(--mut)}
.heat button.on{background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff;font-weight:500}
.ov{position:absolute;inset:0;z-index:40;display:none}
.ov.on{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:350px;max-width:92%;background:linear-gradient(180deg,#120c22,#0a0714);border-left:1px solid var(--line);padding:20px 18px;overflow-y:auto}
.panel h2{margin:0 0 3px;font-size:17px;font-weight:600}
.panel .sub{font-size:11.5px;color:var(--dim);margin-bottom:15px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin-bottom:6px}
.fld input,.fld select{width:100%;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);padding:9px 11px;font-size:13px;outline:none}
.fld select option{background:#150f26}
.fld .hint{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.055)}
.tog span{font-size:13px}.tog small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.sw{width:40px;height:23px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:99px;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(140deg,var(--pink),var(--violet))}.sw.on::after{left:20px}
.pbtn{width:100%;border-radius:12px;padding:11px;font-size:13px;font-weight:500;background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff;margin-top:6px}
.pbtn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);margin-top:9px}
.close-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--mut)}
.memchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.memchips span{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(168,85,247,.14);border:1px solid rgba(168,85,247,.3);color:#e0ccff}
.memchips .empty{background:none;border:1px dashed rgba(255,255,255,.15);color:var(--dim)}
.lb{background:rgba(5,3,10,.95);display:none;place-items:center;padding:18px;z-index:60}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:76%;border-radius:16px;border:1px solid var(--line)}
.lb .lbcap{color:var(--mut);font-size:12px;text-align:center;margin-top:11px}
.lb .lbbtns{display:flex;gap:9px;margin-top:11px;justify-content:center}
.lb .lbbtns button{font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);padding:8px 15px;border-radius:11px}
.gate{background:rgba(6,4,12,.96);display:none;place-items:center;text-align:center;padding:30px;z-index:80}
.gate.on{display:grid}
.gate h2{font-size:25px;margin:0 0 8px}
.gate p{color:var(--mut);font-size:13.5px;line-height:1.6;margin:0 0 18px}
.gate .btns{display:flex;gap:10px;justify-content:center}
.gate button{padding:11px 22px;border-radius:13px;font-size:13.5px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.gate button.pri{background:linear-gradient(140deg,var(--pink),var(--violet));border-color:transparent;color:#fff}
@media(max-width:620px){.app{height:100dvh;border-radius:0}.wrap{max-width:none}.grid{grid-template-columns:repeat(2,1fr)}.rail{display:none}.back{display:grid}}
</style>

<div class="app">
  <div class="rail">
    <div class="brand-dot">DL</div>
    <div class="rail-avatars" id="railAv"></div>
    <button class="icon-btn" id="railNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="icon-btn" id="railSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.05A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.05A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.05a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.05a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
  </div>

  <div class="stage">
    <div class="view on" id="vDisc">
      <div class="disc">
        <div class="hero">
          <h1 id="h1a"></h1>
          <p id="hsub"></p>
          <div class="badges" id="badges"></div>
          <div class="install">
            <button class="pri" id="btnInstall">install as app</button>
            <button id="btnSave">save a copy of this app</button>
          </div>
        </div>

        <p class="lbl" id="lblLang">language</p>
        <div class="langrow" id="langRow"></div>

        <p class="lbl" id="lblVibe">who is she to you</p>
        <div class="seg" id="vibeSeg"></div>

        <p class="lbl" id="lblMode">how many</p>
        <div class="seg" id="modeSeg"><button data-m="solo" class="on">1 on 1</button><button data-m="duo">couple</button></div>

        <div class="sec-title"><h2 id="lblPick">pick someone</h2><em id="hint"></em></div>
        <div class="grid" id="grid"></div>

        <div class="sec-title"><h2 id="lblScene">scenes</h2><em>optional</em></div>
        <div class="strip" id="sceneStrip"></div>

        <div class="note" id="foot"></div>
      </div>
      <div class="pairbar" id="pairbar"><div class="txt" id="pairTxt"></div><button id="pairGo">start</button></div>
    </div>

    <div class="view" id="vChat">
      <div class="chead">
        <button class="icon-btn back" id="backBtn" style="width:33px;height:33px"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
        <div class="avs" id="cAvs"></div>
        <div><h3 id="cName"></h3><div class="st" id="cStat"><i></i><span>online</span></div></div>
        <div class="grow"></div>
        <div class="heat" id="heatCtl"><button data-h="1">1</button><button data-h="2">2</button><button data-h="3">3</button></div>
        <button class="icon-btn" id="langBtn" style="width:33px;height:33px;font-size:11.5px;font-weight:600">Aअ</button>
        <button class="icon-btn" id="chatMenu" style="width:33px;height:33px"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="comp">
        <div class="chips" id="chips"></div>
        <div class="inbar"><textarea id="inp" rows="1"></textarea><button class="send" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button></div>
        <div class="fine"><span id="fineL"></span><span>∞</span></div>
